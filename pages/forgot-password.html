<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Account Recovery - Student Hub Portal</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>

<body>
    <!-- Ambient Background Mesh Glow Orbs -->
    <div class="ambient-glow-orb ambient-glow-1"></div>
    <div class="ambient-glow-orb ambient-glow-2"></div>

    <div class="login-container">
        <div class="login-brand">
            <div class="login-brand-icon">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/><circle cx="12" cy="16" r="1"/></svg>
            </div>
            <h1>Account Recovery</h1>
            <p class="login-subtitle">Recover access to your Student Hub account</p>
        </div>

        <!-- Step 1: Student ID Verification -->
        <form id="recoveryForm">
            <div id="step1Container">
                <div class="form-group">
                    <label for="recoveryStudentId">Student ID / Enrollment Number</label>
                    <div class="input-icon-wrapper">
                        <div class="input-icon">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect width="18" height="18" x="3" y="3" rx="2"/><path d="M7 7h10"/><path d="M7 12h10"/><path d="M7 17h10"/></svg>
                        </div>
                        <input type="text" id="recoveryStudentId" placeholder="e.g. 25CS027" required>
                    </div>
                </div>

                <p id="recoveryMessage" class="form-message"></p>

                <button type="submit" class="login-button" id="verifyIdBtn">
                    <span>Verify CHARUSAT Student ID</span>
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>
                </button>
            </div>

            <!-- Step 2: New Password Entry -->
            <div id="step2Container" style="display: none; margin-top: 15px;">
                <div style="background: var(--primary-light); padding: 12px 14px; border-radius: var(--radius-sm); font-size: 12.5px; margin-bottom: 16px; border: 1px solid rgba(99,102,241,0.25); color: var(--text-main);">
                    <div style="color: var(--success); font-weight: 700; margin-bottom: 2px;">✓ CHARUSAT Student Verified: Kakadiya Rudri Alpeshbhai (25CS027)</div>
                    <div>OTP <code>1234</code> sent to <strong>25cs027@charusat.edu.in</strong></div>
                </div>

                <div class="form-group">
                    <label for="otpCode">Verification Code (OTP)</label>
                    <input type="text" id="otpCode" placeholder="Enter 4-digit OTP code">
                </div>

                <div class="form-group">
                    <label for="newPassword">New Password</label>
                    <input type="password" id="newPassword" placeholder="Enter new password">
                </div>

                <div class="form-group">
                    <label for="confirmPassword">Confirm New Password</label>
                    <input type="password" id="confirmPassword" placeholder="Confirm new password">
                </div>

                <p id="resetMessage" class="form-message"></p>

                <button type="button" class="login-button" id="resetPasswordBtn">
                    <span>Update Password</span>
                </button>
            </div>
        </form>

        <a href="../index.html" class="back-link">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="m15 18-6-6 6-6"/></svg>
            <span>Back to Portal Login</span>
        </a>
    </div>

    <div id="toastContainer" class="toast-container"></div>

    <script src="../js/forgot-password.js"></script>
</body>
</html>
